services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ontoforge
      POSTGRES_PASSWORD: ontoforge
      POSTGRES_DB: ontoforge
    ports:
      - "5439:5432"
    volumes:
      - ontoforge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ontoforge-pg:
