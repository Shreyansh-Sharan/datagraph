[project]
name = "ontoforge"
version = "0.0.1"
description = "Semantic layer / knowledge-graph platform: compiles W3C R2RML mappings to warehouse-native SQL."
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "owlrl>=7.0",
    "pyshacl>=0.26",
    "graphql-core>=3.2",
    "networkx>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.5",
    "pydantic-settings>=2.4",
    "mcp>=2.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sql-connector>=4.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[project.scripts]
ontoforge = "ontoforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
