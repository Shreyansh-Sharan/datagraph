[project]
name = "ontoforge"
version = "0.0.1"
description = "Semantic layer / knowledge-graph platform: compiles W3C R2RML mappings to warehouse-native SQL."
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
